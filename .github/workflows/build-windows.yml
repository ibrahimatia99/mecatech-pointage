name: Build Mecatech Pointage - Windows

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        shell: powershell
        run: |
          python -m compileall -q .

      - name: Run backend tests
        shell: powershell
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build application
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean MecatechPointage.spec

      - name: Copy runtime files
        shell: powershell
        run: |
          Copy-Item "README_WINDOWS.txt" "dist\MecatechPointage\README_WINDOWS.txt"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          iscc installer.iss

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MecatechPointage-Windows
          path: |
            dist/MecatechPointage/
            installer/MecatechPointage-Setup-*.exe
