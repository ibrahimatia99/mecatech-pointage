name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --name "MecatechPointage" --add-data "templates;templates" --add-data "static;static" --add-data "config.json;." --hidden-import="zeroconf" --hidden-import="tkinter" --noconsole app.py

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: MecatechPointage-Windows
        path: dist/MecatechPointage/
