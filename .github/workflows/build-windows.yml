name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller Pillow pywebview

    - name: Convert PNG Icon to ICO
      run: |
        python -c "from PIL import Image; img = Image.open('static/uploads/icon_icon.png'); img.save('static/uploads/icon_icon.ico', format='ICO', sizes=[(256, 256)])"

    - name: Build Windows Executable
      run: |
        pyinstaller --noconsole --onefile --icon="static/uploads/icon_icon.ico" --add-data "templates;templates" --add-data "static;static" --name "MecatechPointage" run_app.py

    - name: Upload Windows App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MecatechPointage-Windows
        path: dist/MecatechPointage.exe
