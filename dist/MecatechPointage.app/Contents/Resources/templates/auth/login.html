{% extends 'base.html' %}

{% block extra_head %}
<style>
  :root {
    --bg: #f4f5f9;
    --card-bg: #ffffff;
    --text-main: #1e1b2e;
    --primary: {{ cfg.primary_color }};
    --border: #e9e8f4;
  }
  body {
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .login-card {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 24px;
    border: 1px solid var(--border);
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    text-align: center;
  }
  .login-card input {
    width: 100%;
    padding: 12px 16px;
    margin: 15px 0;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    box-sizing: border-box;
    outline: none;
    background: var(--bg);
    color: var(--text-main);
  }
  .login-card button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 50px;
    background: var(--primary);
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
  }
  .error-msg {
    color: #ef4444;
    font-size: 13px;
    margin-bottom: 10px;
  }
</style>
{% endblock %}

{% block layout %}
<div class="login-card">
  <h2>{{ cfg.app_name }}</h2>
  <p style="color:#8e8ba7; font-size:14px; margin-top:5px;">Enter administrative password</p>
  
  <form method="POST" action="{{ url_for('auth.login') }}" style="margin-top:20px;">
    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}
    <input type="password" name="password" placeholder="Password" required autofocus>
    <button type="submit">Sign In</button>
  </form>
</div>
{% endblock %}
