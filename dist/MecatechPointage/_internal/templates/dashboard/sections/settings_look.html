<div class="section-card">
  <h3 style="margin-bottom: 20px; font-size: 16px;"><i class="fa-solid fa-palette"></i> Look & Customization</h3>
  
  <div style="display: flex; flex-direction: column; gap: 18px;">
    <div>
      <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">
        <i class="fa-solid fa-signature"></i> APP NAME
      </label>
      <input type="text" name="app_name" value="{{ cfg.app_name }}" placeholder="Mecatech Pointage">
    </div>

    <div>
      <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">
        <i class="fa-solid fa-droplet"></i> PRIMARY COLOR
      </label>
      <div class="color-picker-wrapper">
        <input type="color" id="primary_color_picker" value="{{ cfg.primary_color }}" oninput="document.getElementById('primary_color_text').value = this.value">
        <input type="text" id="primary_color_text" name="primary_color" value="{{ cfg.primary_color }}" placeholder="#d93677">
      </div>
    </div>

    <div>
      <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">
        <i class="fa-solid fa-image"></i> APP LOGO
      </label>
      <div style="display: flex; gap: 15px; align-items: center;">
        <div class="preview-box">
          <img id="logo-preview" src="{{ cfg.app_logo if cfg.app_logo else '' }}" alt="Logo" style="{% if not cfg.app_logo %}display:none;{% endif %}">
        </div>
        <input type="file" name="app_logo" accept="image/*" onchange="previewImage(this, 'logo-preview')" style="flex: 1;">
      </div>
    </div>

    <div>
      <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">
        <i class="fa-solid fa-icons"></i> APP ICON / FAVICON
      </label>
      <div style="display: flex; gap: 15px; align-items: center;">
        <div class="preview-box">
          <img id="icon-preview" src="{{ cfg.app_icon if cfg.app_icon else '' }}" alt="Icon" style="{% if not cfg.app_icon %}display:none;{% endif %}">
        </div>
        <input type="file" name="app_icon" accept="image/*" onchange="previewImage(this, 'icon-preview')" style="flex: 1;">
      </div>
    </div>
  </div>
</div>
