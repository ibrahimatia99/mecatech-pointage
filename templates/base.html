    window.t = function(key, fallback) {
      const lang = window.APP_LANGUAGE || 'en';
      let value = (window.APP_I18N[lang] && window.APP_I18N[lang][key]) || window.APP_I18N.en[key] || fallback || key;
      return String(value);
    };
    window.applyTranslations = function(root) {
      const scope = root || document;
      scope.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = window.t(el.dataset.i18n, el.textContent); });
      scope.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = window.t(el.dataset.i18nPlaceholder, el.placeholder); });
      document.title = document.title.replace(/^[^|]+/, (window.APP_I18N[window.APP_LANGUAGE]?.app_name || 'Mecatech Pointage'));
